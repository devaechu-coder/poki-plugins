# 치장 목록 — 맨 앞 이름(id)이 명령어에 쓰는 이름 (띄어쓰기 대신 _)
#   /치장관리 지급 <마크닉> 꽃_모자
# 바꾼 뒤 /치장관리 리로드
#
# 공통
#   name        : 보여줄 이름 (&색 코드, &#RRGGBB 가능)
#   category    : 모자 / 파티클
#   description : 옷장에 보일 설명 (여러 줄 가능)
#   unlock      : 잠겨 있을 때 보일 얻는 방법
# 모자
#   material    : 머리에 씌울 아이템 (모델이 생기기 전엔 바닐라 아이템으로 임시)
#   model       : 리소스팩 custom_model_data 번호 (0 = 안 씀). 모자는 1101~1199 사용
#                 (1001 은 포키 롤리팝, 칭호 배지는 글자 ~ 이라 겹치지 않음)
# 파티클
#   icon        : 옷장에 보일 아이콘 아이템
#   particle    : 마크 파티클 이름 (HEART, END_ROD, CHERRY_LEAVES, NOTE, FLAME, DUST ...)
#   color       : DUST 일 때 색 (#RRGGBB)
#   count       : 한 번에 몇 개

