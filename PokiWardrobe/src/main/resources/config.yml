# 포키 서버 치장 설정 — 바꾼 뒤 /치장관리 리로드
# 치장 목록은 cosmetics.yml

# false: 운영진(poki.wardrobe.use 권한, 기본 OP)만 /치장 사용 — 유저 테스트 동안은 false
# true : 모두 사용
open-to-everyone: false

particles:
  # 몇 틱마다 파티클을 뿌릴지 (20 = 1초). 숫자가 클수록 가벼움
  interval-ticks: 5
  # true 면 움직일 때만 뿌림 (가만히 있으면 안 나옴)
  moving-only: false
  # 이 거리(칸) 안에 있는 사람한테만 보냄
  view-distance: 24
