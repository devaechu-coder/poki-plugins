name: PokiWardrobe
version: ${project.version}
main: kr.devaechu.pokiwardrobe.PokiWardrobe
api-version: '1.21'
author: DevAechu
description: 포키 서버 치장 — 옷장 GUI, 모자, 파티클 (패킷 미사용)
commands:
  wardrobe:
    description: 치장 옷장 열기
    usage: /치장 [파티클|파티클숨기기|벗기]
    aliases: [치장]
  wardrobeadmin:
    description: 치장 지급·회수·리로드
    usage: /치장관리 <지급|회수|보기|목록|리로드>
    aliases: [치장관리]
    permission: poki.wardrobe.admin
permissions:
  poki.wardrobe.use:
    description: 치장 쓰기 (config 의 open-to-everyone 이 false 일 때 필요)
    default: op
  poki.wardrobe.admin:
    description: 치장 지급·회수·리로드
    default: op
