# ─── PokiLive 설정 ───
# 무대·스크린 위치는 /공연 무대, /공연 스크린 으로 정하면 아래 stage:, screen: 에 저장됨 (직접 고칠 필요 없음)

# 무대 중심에서 이 거리 안에 있는 사람만 제목·카운트다운·효과음을 받음
radius: 64

# 스크린 글자 크기 (POKI LIVE 콘서트장 20x8 스크린 기준 5 정도)
screen-scale: 5.0
# 문구에 색 코드(&)가 없으면 분홍→하늘→보라 로 색이 계속 바뀜
screen-color-cycle: true

# 불꽃 쏘는 자리 — 무대 중심 기준 [옆(+오른쪽), 앞(+객석 쪽), 위]
# 무대에 서서 객석을 볼 때 오른쪽이 +. 기본값은 POKI LIVE 스키매틱에 맞춤
firework-points:
  - [-13, 4, 0.5]    # 무대 앞 왼쪽 끝
  - [13, 4, 0.5]     # 무대 앞 오른쪽 끝
  - [-17, 0, 9]      # 왼쪽 조명탑 꼭대기
  - [17, 0, 9]       # 오른쪽 조명탑 꼭대기
  - [-8, -3, 12]     # 아치 왼쪽
  - [8, -3, 12]      # 아치 오른쪽
  - [0, -3, 12.5]    # 아치 가운데

# 치지직 라이브 → 영상 프레임(TV) 연결 (WATERFrAMES 모드가 서버·클라 둘 다 있어야 함)
# /공연 티비 로 TV 자리 저장 후 /공연 치지직 [채널ID]. 여기 넣어두면 채널ID 생략 가능
chzzk:
  channel: ""

# 조명 파티클이 뿌려지는 객석 범위 — 무대 중심 기준
audience:
  side: 11           # 좌우 폭 (±)
  front-min: 6       # 무대 중심에서 앞으로 몇 칸부터
  front-max: 30      # 몇 칸까지
  height-min: 1
  height-max: 7

# 스포트라이트 빛기둥 진하기 (0~255, 클수록 진함)
spotlight:
  outer-alpha: 28
  inner-alpha: 38

messages:
  prefix: "&d[공연] &f"
  opening-subtitle: "&bPOKI LIVE"
  finale-title: "&d감사합니다!"
  finale-subtitle: "&bPOKI LIVE"
