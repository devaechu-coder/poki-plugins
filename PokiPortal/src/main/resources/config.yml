# 네더 이동권 — 들고 우클릭하면 1장 쓰고 네더 랜덤 위치로 이동. 돌아올 땐 /스폰
ticket:
  # 생김새 (포키 모드 뽑기권 아이템 4번 그림). 모드가 없으면 종이
  item: 'pokicos:ticket[minecraft:custom_model_data=4]'
  name: '&6네더 이동권'
  lore:
    - '&7들고 &f우클릭&7하면 네더(지옥) 랜덤 위치로 이동'
    - '&7돌아올 때는 &f/스폰'

# 랜덤 위치 범위 (네더 좌표, 0,0 기준)
random:
  min-distance: 300
  max-distance: 3000
  tries: 30        # 안전한 자리 찾을 때까지 최대 몇 번 (한 틱에 한 번씩)
  min-y: 32
  max-y: 118

# 이동 전 대기 (초) — 0 이면 바로. 움직이면 취소
warmup: 3

# 네더 포털 막기 (불 붙이기·포털 이동). poki.portal.bypass 권한(운영진)은 예외
block-portals: true

messages:
  used: '&6네더로 이동할 자리를 찾는 중... &7(움직이지 마세요)'
  moved: '&c움직여서 이동이 취소됐어요. 이동권은 돌려드렸어요.'
  arrived: '&6네더에 도착했어요! &7돌아갈 때는 &f/스폰'
  failed: '&c안전한 자리를 못 찾았어요. 이동권은 돌려드렸어요. 다시 해 주세요.'
  no-nether: '&c네더 월드를 찾을 수 없어요. 운영진에게 알려주세요.'
  in-nether: '&7이미 네더에 있어요.'
  portal-blocked: '&c네더 포털은 막혀 있어요. &6네더 이동권&c을 사용해 주세요 (상점).'
