# 포키 잠수 킥 (PokiAfk)
# 게임 안에서 /잠수 시간 <분>, /잠수 꽉참만 켜기|끄기 로 바꿀 수 있음 (바로 적용, 여기 저장)

# 이만큼(분) 아무것도 안 하면 킥
kick-after-minutes: 60

# 킥 몇 초 전에 경고할지 (화면 가운데 글씨 + 채팅). 0 = 경고 없음
warn-before-seconds: 60

# 켜면: 서버가 거의 꽉 찼을 때만 킥 (자리가 남아 있으면 잠수해도 그대로 둠)
only-when-full:
  enabled: false
  # 빈자리가 이만큼 이하로 남으면 "꽉 참"
  free-slots: 2

# 잠수 킥을 통계(PokiStats → 운영 통계 [플레이 기록])에 남길지
stats: true

# 활동으로 치는 것: 시점 돌리기, 걸어다니기(물속·탈것·떠밀려 가는 건 빼고), 채팅, 명령어, 블록 부수기·놓기, 우클릭, 인벤토리
# 운영진(pokiafk.exempt 권한, 기본 OP)은 킥 안 당함

messages:
  warn-title: '&e잠수 중이에요'
  warn-subtitle: '&f{seconds}초 뒤에 접속이 끊겨요 · 움직이면 괜찮아요'
  warn-chat: '&e[포키] &f{minutes}분 동안 활동이 없어서 &e{seconds}초 &f뒤에 접속이 끊겨요. 움직이면 괜찮아요!'
  kick: '&e{minutes}분 동안 활동이 없어서 접속이 끊겼어요.\n&f다시 들어오면 돼요!'
  # 킥할 때 운영진 채팅 알림 (비우면 안 보냄)
  staff: '&7[잠수] {name} 님을 {minutes}분 잠수로 내보냈어요'
