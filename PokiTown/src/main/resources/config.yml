# 포키 마을 (PokiTown) 설정
# 마을 정보는 Towny 에서 바로 읽음. 여기엔 표시 방법만.
# 마을별 표시 이름·색, 전체 마을 목록 공개 스위치는 plugins/PokiTown/towns.yml (명령어 /마을앱 으로 바꿈)

# config 형식 버전 (플러그인이 관리 — 건드리지 않기)
config-version: 1

# 마을 이름 기본 색 (머리 위·앱). &b 같은 색 코드나 &#7EC8E3 같은 헥스 색
default-color: '&#8FD3FF'

# 마을 이름이 욕설 필터에 걸리면 대신 보여줄 이름 (Towny 이름은 안 바뀜)
# 운영진이 /마을앱 표시 <마을> <이름> 으로 따로 정해주면 그걸 보여줌
filtered-name: '마을'

# 포키폰 알림 (포키폰이 있을 때만) — 초대 받음, 주민 들어옴·나감, 부이장·알바 지정
notify: true
