# 칭호 목록 — 맨 앞 이름(id)이 명령어에 쓰는 이름. 띄어쓰기 대신 _
#   /칭호 지급 <마크닉> 포켓몬_마스터   (띄어쓰기 그대로 '포켓몬 마스터' 도 됨)
# - name  : 칭호 이름
# - glyph : 리소스팩(PokiTitles-RP) 배지 글자 코드 — font/default.json 과 맞아야 함
# - chat  : Tab 목록·채팅에 붙는 글씨 (배지는 한 줄에 안 들어가서 색 글씨로)
# - tier  : 등급 (표시용, 마음대로 바꿔도 됨)
# 새 칭호: 리소스팩에 배지 PNG + 글자 코드 추가 → 여기 추가 → /칭호 리로드

