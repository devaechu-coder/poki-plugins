# 포키 서버 이름표 설정
# 색 코드: &a &e 같은 마크 색 코드, &#FF7F7F 같은 헥스 색 사용 가능
# 바꾼 뒤 /한글닉 리로드

# config 형식 버전 (플러그인이 관리 — 건드리지 않기)
config-version: 2

# 머리 위 이름표
nametag:
  # display: 원래 마크닉을 숨기고 한글닉만 보여줌
  # prefix : "한글닉 마크닉" 형태 (원래 이름표에 접두사만 붙임)
  mode: display

  # [display 모드] 머리 위에 보일 글씨 ({nick} 한글닉, {name} 마크닉)
  display-text: '&f{nick}'
  # [display 모드] 글씨 높이 (머리 위로 얼마나 띄울지)
  height-offset: 0.6
  # [display 모드] 접속·차원 이동 후 이름표를 띄우기까지 기다리는 시간 (20 = 1초)
  spawn-delay-ticks: 20
  # [display 모드] 벽 너머로도 보이게 할지 (true 면 셰이더+비 올 때 글씨가 가려질 수 있음)
  see-through: false

  # [prefix 모드] 설정
  prefix: '&f{nick} &7'
  suffix: ''
  # 원래 마크닉 색 (GRAY, WHITE, YELLOW, GREEN, AQUA, RED 등)
  name-color: GRAY

# Tab 목록에 보이는 이름 ({title} 칭호, {nick} 한글닉, {name} 마크닉)
tab-name: '{title}&f{nick}'

# 채팅 등에 쓰이는 이름 ({title} 칭호, {nick} 한글닉, {name} 마크닉)
display-name: '{title}{nick}'

# 칭호 — 칭호 목록은 plugins/PokiName/titles.yml, 머리 위 배지 이미지는 PokiTitles 리소스팩
title:
  enabled: true
  # 머리 위에 배지 이미지 띄우기 (리소스팩 필요)
  overhead: true
  # 배지를 이름표보다 얼마나 위에 띄울지
  gap: 0.3
  # 배지 크기 배율 (1.0 = 리소스팩 기본 크기)
  scale: 1.0
  # 한글닉이 없는 사람은 원래 이름표 위에 띄움 — 그 이름표 높이
  vanilla-nametag-offset: 0.6
  # Tab·채팅에 붙는 칭호 글씨 ({title} = titles.yml 의 chat)
  chat-format: '{title}&r '
  # 서버에서 칭호를 처음 받으면 전체 공지 (칭호 하나씩 지급할 때만, '전체' 지급은 안 침)
  # 칭호별로 끄려면 titles.yml 에서 그 칭호에 announce-first: false
  # 오픈 직전에 /칭호 최초초기화 전체 로 테스트 기록 지우기
  first:
    enabled: true
    # 전체 채팅 ({nick} 한글닉, {name} 마크닉, {title} 칭호 글씨, {title_name} 칭호 이름)
    message: '&6&l[서버 최초] &f{nick} &e님이 {title} &e칭호를 서버에서 처음으로 얻었어요!'
    # 화면 가운데 큰 글씨 (비우면 안 띄움)
    screen-title: '&6&l서버 최초!'
    screen-subtitle: '&f{nick} &7- {title}'
    # 효과음 (비우면 소리 없음)
    sound: UI_TOAST_CHALLENGE_COMPLETE

# Tab 목록 위 문구 ({player} 한글닉(없으면 마크닉), {name} 마크닉, {online} 접속자 수, {max} 최대 인원)
header:
  - ''
  - '&c&l[ 포키 서버 ]'
  - '&f환영합니다 &a&l{player}&f 님'
  - '&f현재 접속자 &e{online}&f 명'
  - ''

# Tab 목록 아래 문구 (비워두면 안 나옴)
footer: []

# 모든 순위(소지금·코블달러)에서 뺄 사람 — 마크닉이나 한글닉. 예: [Dev_Aechu, 서버총괄]
# 각 순위의 exclude 와 합쳐짐. 바꾼 뒤 /한글닉 리로드 → 콘솔 "순위 켜짐 … 제외: [...]" 로 확인
rank-exclude: []

# 소지금 순위 (Vault 경제 = Essentials 돈). 홀로그램에 %pokiname_money_1% ~ %pokiname_money_10% 로 사용
# 한글닉이 있으면 한글닉으로, 없으면 마크닉으로 나옴. 바꾼 뒤 /한글닉 리로드
money-rank:
  enabled: true
  # 몇 초마다 다시 계산할지
  interval-seconds: 10
  # 몇 등까지 계산할지 (최대 50) — 홀로그램 줄 수와 맞추기
  size: 5
  # 돈이 1 미만인 사람은 순위에서 빼기
  hide-zero: true
  # 순위에서 뺄 사람 — 마크닉이나 한글닉 (운영진 계정 등). 예: [Dev_Aechu, 서버총괄]
  exclude: []
  # 금액 표시 ({value} = 7,199 처럼 쉼표 넣고 소수점 버림)
  value-format: '${value}'
  # %pokiname_money_<n>% 한 줄 형식 ({rank} 등수, {nick} 한글닉, {name} 마크닉, {value} 금액)
  line: '&f{rank}등 : &e{nick} &f/ &a{value}'
  # 그 등수에 사람이 없을 때
  empty-line: '&7{rank}등 : -'
  # 1등이 바뀔 때 콘솔에서 실행할 명령어 ({name} 마크닉, {nick} 한글닉, {value} 금액)
  # 서버 켤 때·리로드할 때도 한 번 실행됨
  # Citizens 7번 NPC: 이름을 1등 한글닉으로, 스킨을 1등 스킨으로 (이름 먼저 바꾸고 스킨)
  on-first-change:
    - 'npc rename --id 7 {nick}'
    - 'npc skin --id 7 {name}'

# 코블달러 순위 (CobbleDollars 모드). 홀로그램에 %pokiname_cobble_1% ~ %pokiname_cobble_9% 로 사용
# 한 번이라도 접속한 사람 전부. 접속 중인 사람은 실시간, 나머지는 모드 저장 파일 값.
cobble-rank:
  enabled: true
  interval-seconds: 10
  size: 9
  hide-zero: true
  exclude: []
  value-format: '{value}C'
  line: '&f{rank}등 : &e{nick} &f/ &6{value}'
  empty-line: '&7{rank}등 : -'
  # 코블달러 저장 폴더 (비워두면 <기본 월드>/cobbledollarsplayerdata)
  data-folder: ''
  on-first-change: []

# 바이옴 이름 (%pokiname_biome%, 두 줄용 %pokiname_biome_1% / %pokiname_biome_2%)
# 한글 이름은 plugins/PokiName/biomes.yml 에서 고칠 수 있음
biome:
  # 두 줄로 나눌 때 한 줄 최대 글자 수
  max-length: 10
