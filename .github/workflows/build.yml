name: 빌드

# main 에 올리면 플러그인을 빌드해서, 새 버전이면 Releases 에 jar 를 올림
# PR 에서는 빌드만 해서 깨지는지 미리 확인 (릴리스 안 함)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [PokiName, PokiLinks, PokiDonate, PokiStats, PokiMaintenance, PokiHelp, PokiUI, PokiMascot, PokiLive]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 빌드
        working-directory: ${{ matrix.plugin }}
        env:
          # PokiStats 에 같이 빌드되는 통계 서버 주소·비밀 키 (레포 Settings → Secrets → Actions)
          STATS_ENDPOINT: ${{ secrets.STATS_ENDPOINT }}
          STATS_SECRET: ${{ secrets.STATS_SECRET }}
        run: mvn -B -q package "-Dstats.endpoint=$STATS_ENDPOINT" "-Dstats.secret=$STATS_SECRET"
      - name: 버전 확인
        id: v
        working-directory: ${{ matrix.plugin }}
        run: |
          VER=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.plugin }}-v$VER" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # Actions 저장 공간이 꽉 차도 빌드·릴리스는 계속
        with:
          retention-days: 1
          name: ${{ matrix.plugin }}-${{ steps.v.outputs.ver }}
          path: ${{ matrix.plugin }}/target/${{ matrix.plugin }}-${{ steps.v.outputs.ver }}.jar
      - name: 새 버전이면 릴리스
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 은 이미 있음 — 건너뜀"
          else
            gh release create "$TAG" "${{ matrix.plugin }}/target/${{ matrix.plugin }}-${{ steps.v.outputs.ver }}.jar" \
              --title "${{ matrix.plugin }} ${{ steps.v.outputs.ver }}" --notes "${{ matrix.plugin }}/README.md 의 버전 기록 참고"
          fi

  # 리소스팩 (칭호 배지) — 폴더의 VERSION 이 새로우면 Releases 에 zip 을 올림
  resourcepack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: [PokiTitles-RP]
    steps:
      - uses: actions/checkout@v4
      - name: 압축
        id: rp
        env:
          PACK: ${{ matrix.pack }}
        run: |
          VER=$(tr -d '[:space:]' < "$PACK/VERSION")
          cd "$PACK"
          zip -q -r -X "../$PACK.zip" pack.mcmeta pack.png assets
          cd ..
          SHA1=$(sha1sum "$PACK.zip" | cut -d' ' -f1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "tag=$PACK-v$VER" >> "$GITHUB_OUTPUT"
          echo "$PACK $VER sha1=$SHA1"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 1
          name: ${{ matrix.pack }}-${{ steps.rp.outputs.ver }}
          path: ${{ matrix.pack }}.zip
      - name: 새 버전이면 릴리스
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag }}
          PACK: ${{ matrix.pack }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 은 이미 있음 — 건너뜀"
          else
            gh release create "$TAG" "$PACK.zip" --title "$PACK ${{ steps.rp.outputs.ver }}" \
              --notes "resourcepacks-poki.zip 안에 넣어서 R2 에 올리기 (sha1 ${{ steps.rp.outputs.sha1 }})"
          fi

  # main 에 올리면(PR 머지) R2(poki-files) poki/server/plugins/<이름>-<버전>.jar + poki/server/plugins.json 갱신
  # 서버장용 목록 페이지: files.devaechu.com/poki/server/index.html (poki-mods 가 올림)
  # 레포 Secrets: R2_ACCESS_KEY_ID · R2_SECRET_ACCESS_KEY · R2_ENDPOINT
  r2:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2: ${{ secrets.R2_ENDPOINT }}
      BUCKET: poki-files
      PLUGINS: PokiName PokiLinks PokiDonate PokiStats PokiMaintenance PokiHelp PokiUI PokiMascot PokiLive
    steps:
      - uses: actions/checkout@v4
      - name: 올리기
        run: |
          s3() { aws s3 --endpoint-url "$R2" "$@"; }
          ver() { python3 -c "import xml.etree.ElementTree as E,sys;r=E.parse(sys.argv[1]).getroot();ns={'m':'http://maven.apache.org/POM/4.0.0'};print(r.find('m:version',ns).text.strip())" "$1/pom.xml"; }
          mkdir -p dist; echo '{}' > plugins.json
          s3 cp "s3://$BUCKET/poki/server/plugins.json" old.json 2>/dev/null || echo '{}' > old.json
          for p in $PLUGINS; do
            v=$(ver $p); f="$p-$v.jar"
            old=$(jq -r --arg p "$p" '.[$p].version // ""' old.json)
            upd=$(jq -r --arg p "$p" '.[$p].updated // ""' old.json)
            if [ "$old" != "$v" ]; then
              gh release download "$p-v$v" -D dist -p "$f" --clobber
              s3 cp "dist/$f" "s3://$BUCKET/poki/server/plugins/$f" --content-type application/java-archive
              upd=$(TZ=Asia/Seoul date '+%m/%d %H:%M'); echo "올림 $f"
            fi
            jq --arg p "$p" --arg v "$v" --arg f "$f" --arg u "$upd" '. + {($p): {version: $v, file: $f, updated: $u}}' plugins.json > t.json && mv t.json plugins.json
          done
          cat plugins.json
          s3 cp plugins.json "s3://$BUCKET/poki/server/plugins.json" --content-type application/json --cache-control no-cache
