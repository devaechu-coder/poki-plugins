name: 빌드

# main 에 올리면 플러그인을 빌드해서, 새 버전이면 Releases 에 jar 를 올림
# PR 에서는 빌드만 해서 깨지는지 미리 확인 (릴리스 안 함)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [PokiName, PokiLinks, PokiDonate, PokiWardrobe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 빌드
        working-directory: ${{ matrix.plugin }}
        run: mvn -B -q package
      - name: 버전 확인
        id: v
        working-directory: ${{ matrix.plugin }}
        run: |
          VER=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.plugin }}-v$VER" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ steps.v.outputs.ver }}
          path: ${{ matrix.plugin }}/target/${{ matrix.plugin }}-${{ steps.v.outputs.ver }}.jar
      - name: 새 버전이면 릴리스
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 은 이미 있음 — 건너뜀"
          else
            gh release create "$TAG" "${{ matrix.plugin }}/target/${{ matrix.plugin }}-${{ steps.v.outputs.ver }}.jar" \
              --title "${{ matrix.plugin }} ${{ steps.v.outputs.ver }}" --notes "${{ matrix.plugin }}/README.md 의 버전 기록 참고"
          fi

  # 칭호 배지 리소스팩 — PokiTitles-RP/VERSION 이 새로우면 Releases 에 zip 을 올림
  resourcepack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 압축
        id: rp
        run: |
          VER=$(tr -d '[:space:]' < PokiTitles-RP/VERSION)
          cd PokiTitles-RP
          zip -q -r -X ../PokiTitles-RP.zip pack.mcmeta pack.png assets
          cd ..
          SHA1=$(sha1sum PokiTitles-RP.zip | cut -d' ' -f1)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "tag=PokiTitles-RP-v$VER" >> "$GITHUB_OUTPUT"
          echo "리소스팩 $VER sha1=$SHA1"
      - uses: actions/upload-artifact@v4
        with:
          name: PokiTitles-RP-${{ steps.rp.outputs.ver }}
          path: PokiTitles-RP.zip
      - name: 새 버전이면 릴리스
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 은 이미 있음 — 건너뜀"
          else
            URL="https://github.com/${{ github.repository }}/releases/download/$TAG/PokiTitles-RP.zip"
            gh release create "$TAG" PokiTitles-RP.zip --title "PokiTitles 리소스팩 ${{ steps.rp.outputs.ver }}" \
              --notes "server.properties
          resource-pack=$URL
          resource-pack-sha1=${{ steps.rp.outputs.sha1 }}"
          fi
