name: 빌드

# main 에 올리면 플러그인을 빌드해서, 새 버전이면 Releases 에 jar 를 올림
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [PokiName, PokiLinks, PokiDonate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 빌드
        working-directory: ${{ matrix.plugin }}
        run: mvn -B -q package
      - name: 버전 확인
        id: v
        working-directory: ${{ matrix.plugin }}
        run: |
          VER=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.plugin }}-v$VER" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ steps.v.outputs.ver }}
          path: ${{ matrix.plugin }}/target/${{ matrix.plugin }}-${{ steps.v.outputs.ver }}.jar
      - name: 새 버전이면 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 은 이미 있음 — 건너뜀"
          else
            gh release create "$TAG" "${{ matrix.plugin }}/target/${{ matrix.plugin }}-${{ steps.v.outputs.ver }}.jar" \
              --title "${{ matrix.plugin }} ${{ steps.v.outputs.ver }}" --notes "${{ matrix.plugin }}/README.md 의 버전 기록 참고"
          fi
