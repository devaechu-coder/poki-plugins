# PokiMascot — 고친 뒤 /포키냥 리로드
# 리소스팩 PokiTitles-RP 1.4.0 이상 필요 (paper + custom_model_data 8401 = 포키냥 모델)

model:
  item: PAPER
  custom-model-data: 8401

# /포키냥 소환 할 때 크기를 안 쓰면 이 크기 (1 = 약 2블록 높이)
default-scale: 1.5

# 둥실둥실 (위아래로 천천히)
bob:
  enabled: true
  height: 0.08      # 크기 1 기준 블록 단위
  ticks: 30         # 한 번 올라가거나 내려가는 시간

# 우클릭하면 보여줄 안내 (& 색 코드, {player} = 닉네임)
# 한 번 누를 때마다 다음 묶음을 보여줌 (마지막 다음엔 처음으로)
messages:
  - - "&d&l[포키냥] &f안녕 {player}! 포키 서버에 온 걸 환영해냥 ♡"
    - "&7처음이면 첫 포켓몬(스타터)부터 받아봐냥!"
  - - "&d&l[포키냥] &f관장은 &e웅이 → 이슬 &f순서로 도전할 수 있어냥."
    - "&7관장을 이기면 레벨 제한이 풀린다냥!"
  - - "&d&l[포키냥] &f곤란한 일이 생기면 &e/문의 &f로 운영진을 불러줘냥."
    - "&7나쁜 사람은 &e/신고 &7해줘냥!"

# 같은 사람이 다시 누를 수 있을 때까지 (초)
cooldown-seconds: 2
# 누를 때 소리 (비우면 안 냄)
sound: entity.cat.ambient
