name: PokiDonate
version: ${project.version}
main: kr.devaechu.pokidonate.PokiDonate
api-version: '1.21'
author: DevAechu
description: 포키 운영진 방송 치지직 후원 연동 (서버 전체 이벤트) — 입주민 후원은 ChzzkLink
commands:
  staffdonate:
    description: 운영진 방송 후원 연동
    usage: /운영후원
    aliases: [운영후원]
permissions:
  poki.donate.use:
    description: /운영후원 도움말 보기
    default: true
  poki.donate.staff:
    description: 운영진 — 채널 연동, 내 후원 기록. 후원은 운영진 보상표(서버 전체 이벤트)로 처리
    default: false
    children:
      poki.donate.streamer: true
  poki.donate.streamer:
    description: (옛 권한) 운영진 권한에 포함
    default: false
  poki.donate.admin:
    description: 관리자 — 전체 기록, 연동 현황, 강제해제, 테스트, 리로드
    default: op
    children:
      poki.donate.staff: true
