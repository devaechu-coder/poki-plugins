# 포키 후원 메뉴판 (보상표)
# 바꾼 뒤 /운영후원 리로드  ← jar 교체·재시작 필요 없음
#
# match
#   exact    : 메뉴 금액과 "딱 맞을 때만" 지급 (4,000원 같은 메뉴에 없는 금액은 지급 안 함)
#   at-least : 그 금액 "이상" 중 가장 높은 칸 하나 지급
match: exact

# 칸 하나
#   amount   : 메뉴 금액
#   name     : /운영후원 보상표 에 보이는 이름
#   message  : 받은 스트리머에게 보낼 채팅 (빈칸이면 안 보냄)
#   commands : 콘솔로 실행할 명령어 (위에서부터 차례로)
#              비워두면([]) 그 메뉴 후원은 '실패 · 보상 명령어 미설정' 으로 남고 관리자에게 알림 → 직접 지급
#   per / max-count : (at-least 일 때만 쓸모) 이 금액당 1개, 최대 개수 → %count%
#
# 명령어·메시지에 쓸 수 있는 값
#   %player%  후원 받은 스트리머의 마크 닉네임
#   %count%   개수 (per 를 안 쓰면 1)
#   %amount%  후원 금액 (숫자만)
#   %donator% 후원자 치지직 닉네임
#
# 특수 명령어
#   @wipe-and-kill : 아래 keep-items 만 남기고 인벤토리(갑옷·왼손 포함) 전부 삭제 → 즉사.
#                    남긴 아이템은 부활하면 돌려줌 (땅에 안 떨어짐)
#
# ⚠ give 는 꼭 minecraft:give 로. 그냥 give 는 Essentials 가 가로채서 아이템 컴포넌트 문법이 깨진다.
# ⚠ custom_model_data 1001 = 포키 롤리팝 전용 (아이템 정의는 데이터팩 함수 poki:give_lollipop 안에 있음)

# 즉사 때 지우지 않을 필수 아이템
#   아이템 id (예: cobblemon:pokedex_red, minecraft:compass), * 사용 가능 (예: cobblemon:pokedex_*)
#   cmd:번호 = custom_model_data 로 찾기 (예: cmd:1001)
#   비어 있으면 전부 삭제
keep-items: []

# 입주민 후원은 ChzzkLink 가 처리 → 이 플러그인은 운영진 방송만 연동 (/운영후원 연동 은 운영진만)
resident: []

# 운영진 (poki.donate.staff) — 서버 전체 이벤트. 후원자 이름은 안 띄움
#   @a = 접속한 모든 사람. 비어 있는 칸([])은 '실패 · 명령어 미설정' + 관리자 알림 → 직접 처리
staff:
  - amount: 1000
    name: '전원 포켓몬 회복'
    message: ''
    commands:
      - 'minecraft:tellraw @a [{"text":"[운영진 후원] ","color":"light_purple","bold":true},{"text":"%player%님 방송 후원으로 ","color":"white","bold":false},{"text":"전원 포켓몬 회복!","color":"green"}]'
      - 'pokeheal @a'   # 서버에서 @a 되는지 한 번 확인 (안 되면 사람마다 실행하도록 바꿔야 함)

  - amount: 3000
    name: '전원 일반 상처약 2개'
    message: ''
    commands:
      - 'minecraft:tellraw @a [{"text":"[운영진 후원] ","color":"light_purple","bold":true},{"text":"%player%님 방송 후원으로 ","color":"white","bold":false},{"text":"전원 상처약 2개!","color":"aqua"}]'
      - 'minecraft:give @a cobblemon:potion 2'

  - amount: 5000
    name: '(미정)'
    message: ''
    commands: []   # TODO 5천원 정하면 채우기

  - amount: 10000
    name: '전원 이상한사탕 3개'
    message: ''
    commands:
      - 'minecraft:tellraw @a [{"text":"[운영진 후원] ","color":"light_purple","bold":true},{"text":"%player%님 방송 후원으로 ","color":"white","bold":false},{"text":"전원 이상한사탕 3개!","color":"green"}]'
      - 'minecraft:give @a cobblemon:rare_candy 3'

  - amount: 30000
    name: '전원 이로치 확률 증가 음식 1개'
    message: ''
    commands: []   # TODO 음식 아이템 id 정해지면

  - amount: 150000
    name: '지정 스트리머 전설·환상 선택권'
    message: '&6전설·환상 선택권 &f후원! &7지정 스트리머에게 직접 지급해 주세요.'
    commands: []   # 운영진이 직접 지급 → 장부에 '실패·미설정' 으로 남아서 /운영후원 미지급 에서 확인
