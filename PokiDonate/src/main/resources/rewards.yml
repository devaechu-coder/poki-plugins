# 포키 후원 보상표
# 바꾼 뒤 /후원 리로드
#
# 구간: 후원 금액이 min 이상인 구간 중 가장 높은 구간 하나만 실행한다.
#   per       : 이 금액당 1개씩 (예: 1000 → 5000원이면 5개). 빼면 금액 상관없이 1개
#   max-count : 한 번 후원에 최대 개수 (마크 한 칸 최대 64)
#   message   : 받은 스트리머에게 보낼 채팅 (빈칸이면 안 보냄)
#   commands  : 콘솔로 실행할 명령어. 따옴표가 섞인 긴 명령어는 "- |-" 블록으로 적는다
#
# 명령어·메시지에 쓸 수 있는 값
#   %player%  연동된 스트리머의 마크 닉네임
#   %count%   개수
#   %amount%  후원 금액 (숫자만, 예: 5000)
#   %donator% 후원자 치지직 닉네임
#
# ⚠ give 는 꼭 minecraft:give 로. 그냥 give 는 Essentials 가 가로채서 아이템 컴포넌트 문법이 깨진다.
# ⚠ custom_model_data 1001 = 포키 롤리팝 전용

# 입주민 (poki.donate.streamer)
resident:
  - min: 1000
    per: 1000
    max-count: 64
    message: '&d포키 롤리팝 &f%count%개 도착! &7(%donator%님 %amount%원 후원)'
    commands:
      - |-
        minecraft:give %player% minecraft:bread[custom_name='{"text":"포키 롤리팝","color":"#FF6FA8","bold":true,"italic":false}',lore=['{"text":"핑크·하늘·보라 세 가지 맛이 빙글빙글","color":"#9FD8FF","italic":false}','{"text":"♥ 후원 감사 선물 ♥","color":"#C58CFF","italic":false}'],custom_model_data=1001,enchantment_glint_override=true,food={nutrition:10,saturation:12.0f,can_always_eat:true,eat_seconds:0.8f,effects:[{effect:{id:"minecraft:regeneration",duration:160,amplifier:1},probability:1.0f},{effect:{id:"minecraft:absorption",duration:2400,amplifier:0},probability:1.0f},{effect:{id:"minecraft:speed",duration:1200,amplifier:0},probability:1.0f}]}] %count%

# 운영진 (poki.donate.staff) — 서버 전체 이벤트. 아직 안 정함 → 비어 있으면 운영진 후원은 '대상 아님'으로 기록
staff: []
