# 보호할 시설물 (모드 블록 id) — 부수기·폭발·피스톤·불로 못 없앰. 우클릭 사용은 그대로
#  월드에 원래 있던 것만 보호. 유저가 직접 설치한 건 기록해 두고 보호 안 함 (본인이 다시 캘 수 있게)
#  블록 id 는 F3 화면 오른쪽 "Targeted Block" 에서 확인
protected:
  - simpletms:machine_tm
  - cobblemon:healing_machine
  - cobblemon:pc

# 마을(Towny) 땅에서만 설치할 수 있는 블록 — 야생에는 못 놓음
town-only:
  - cobblemon:poke_snack

messages:
  protected: "&c보호된 시설물이라 부술 수 없어요."
  town-only: "&c이 블록은 마을 땅에서만 설치할 수 있어요."
  no-towny: "&c마을 플러그인을 찾을 수 없어서 설치할 수 없어요. 운영진에게 알려주세요."
