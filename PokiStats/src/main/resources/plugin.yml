name: PokiStats
version: ${project.version}
main: kr.devaechu.pokistats.PokiStats
api-version: '1.21'
author: DevAechu
description: 포키 운영 통계 + 명예의 전당 (동접·접속·후원·게임 이벤트를 통계 서버로, /명예의전당 순위)
softdepend: [PokiDonate, Vault, PlaceholderAPI, PokiName]
commands:
  pokistats:
    description: 통계 전송 상태 / 바로 보내기 / 리로드
    usage: /통계 [상태|보내기|리로드]
    aliases: [통계]
    permission: poki.stats.admin
  hof:
    description: 명예의 전당 순위 (GUI)
    usage: /명예의전당 [순위종류] [주간]
    aliases: [명예의전당, 포키순위]
permissions:
  poki.stats.admin:
    description: /통계 명령어
    default: op
  pokistats.rank.hidden:
    description: 순위(인게임·웹)에서 빠짐 — 운영진·테스트 계정용. OP 라도 자동으로 안 붙음
    default: false
