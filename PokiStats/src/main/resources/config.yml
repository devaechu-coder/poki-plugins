# PokiStats — 운영 통계
# 서버는 통계 서버로 "보내기만" 함 (밖에서 서버로 들어오는 연결 없음 → 집 IP 공개 안 됨)

# 통계 서버 받는 주소와 비밀 키
# 비워두면 jar 에 같이 빌드된 값을 씀 (GitHub 레포 비밀값 STATS_ENDPOINT / STATS_SECRET)
# 여기 직접 적으면 그게 우선. 둘 다 없으면 기록만 쌓아두고 안 보냄 → 생기면 쌓인 것부터 보냄
endpoint: ""
secret: ""

# 이 서버 이름 (나중에 서버가 여러 개여도 구분되게)
server-id: poki

# 몇 분마다 동접자 수를 기록하고 보낼지
interval-minutes: 5

# 후원 통계 — PokiDonate 장부(donate.db)를 읽기만 함. 지급이 끝난 줄(지급됨/실패/대상 아님/수동)만 보냄
donate:
  enabled: true
  db: plugins/PokiDonate/donate.db
  # /후원 테스트 로 만든 줄도 보낼지 (통계 서버에서 test 로 구분됨)
  include-test: false

# ── 명예의 전당 (인게임 순위) ──
# 게임 이벤트는 PokiEvents 모드가 plugins/PokiStats/inbox 에 남기면 1초마다 읽어서
# 통계 서버로 보내고 인게임 순위(ranks.db)에도 같이 반영 → 웹 명예의 전당과 숫자가 같음
rank:
  # 순위에서 뺄 사람 (마크닉 또는 uuid). 권한 pokistats.rank.hidden 이 있는 사람도 빠짐
  # 기록은 계속 쌓이고 표시(TOP 10·내 순위·홀로그램)에서만 빠짐. 웹 순위에서도 빠짐
  hiddenPlayers: []
  # PokiName 의 순위 제외 목록(rank-exclude · money-rank.exclude · cobble-rank.exclude)도 같이 씀 → 한 곳에만 적으면 됨
  use-pokiname-exclude: true
  # 몇 초마다 순위를 다시 계산할지 (홀로그램도 이때 갱신)
  refresh-seconds: 60

# 소지금($, Vault·Essentials) · 코블달러(C, CobbleDollars) 스냅샷
wealth:
  # 몇 분마다 (서버 끌 때도 한 번)
  interval-minutes: 10
  # 코블달러 저장 폴더 (비워두면 <기본 월드>/cobbledollarsplayerdata)
  cobble-data-folder: ''

# 로비 홀로그램 (/명예의전당 홀로그램 설치 <순위종류>)
hologram:
  # 몇 등까지 보여줄지 (최대 10)
  size: 10
  # 맨 아래 문구 (순위 종류별, 없으면 안 나옴)
  # 키: capture dex shiny legend battle pvp streak evolve hatch tower raid gym masterball money cobble
  footer:
    money: '부자의 자리는 당신의 것일지도!'
    cobble: '부자의 자리는 당신의 것일지도!'
  # 홀로그램 글자 모양 — 마음대로 바꾸고 /통계 리로드 (1분 안에 바뀜)
  # 색: &a 같은 색 코드, &#RRGGBB 헥스 색, &l 굵게, &o 기울임, &m 취소선, &r 초기화
  # 쓸 수 있는 값: {title} 순위 이름(소지금·포획왕…), {rank} 등수, {nick} 한글닉, {name} 마크닉,
  #             {value} 값($152,000 / 340C / 120마리), {size} 몇 등까지, {period} 전체/이번 주, {footer} 위 footer 문구
  format:
    # 맨 위 줄들 (여러 줄 가능)
    header:
      - '&#7CFFB2&l✦ &#7CFFB2&l포키 {title} &#FFD166&l랭킹 &#7CFFB2&l✦'
      - '&#78DFFF&m                                                  '
    # 이번 주 홀로그램이면 제목 바로 아래에 붙는 줄 (빈칸이면 안 붙음)
    weekly: '&#B8C7D9이번 주'
    # 1·2·3등 줄
    line-1: '&#FFD166&l①&r &#FFF2CC{rank}등 : &e{nick} &f/ &a{value}'
    line-2: '&#C9D6E8&l②&r &#F2F6FC{rank}등 : &e{nick} &f/ &a{value}'
    line-3: '&#D99A72&l③&r &#FFF0E6{rank}등 : &e{nick} &f/ &a{value}'
    # 4등부터
    line: '&#8FA8C7&l◆&r &#E3ECF8{rank}등 : &e{nick} &f/ &a{value}'
    # 그 등수에 아무도 없을 때
    empty: '&#8FA8C7&l◆&r &#E3ECF8{rank}등 : &7-'
    # 맨 아래 줄들 ({footer} 가 든 줄은 문구가 없는 순위에선 안 나옴)
    footer:
      - '&#78DFFF&m                                                  '
      - '&#B8C7D9&o{footer}'
  # 순위마다 다르게 하고 싶으면 여기에 같은 항목으로 덮어쓰기 (적은 것만 바뀜). 예:
  # formats:
  #   cobble:
  #     header:
  #       - '&6&l✦ 코블달러 부자 TOP {size} ✦'
  formats: {}
  # 설치·이동할 때 발 위치에서 몇 칸 위가 맨 아랫줄인지 (글자는 여기서 위로 쌓임)
  # 0 = 서 있는 발 위치가 맨 아랫줄, 2.2 = 머리 바로 위
  height: 2.2

# 못 보낸 기록을 최대 몇 개까지 쌓아둘지 (넘으면 오래된 것부터 버림)
max-queue: 50000

# 보낼 때마다 콘솔에 한 줄 남기기
debug: false
